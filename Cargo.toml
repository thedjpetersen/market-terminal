[package]
name = "market-terminal"
version = "0.1.0"
edition = "2021"
description = "A native Rust Bloomberg-inspired terminal workstation"
license = "MIT"
repository = "https://github.com/thedjpetersen/market-terminal"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
