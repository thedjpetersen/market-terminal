[package]
name = "market-terminal-api"
version = "0.1.0"
edition = "2021"
description = "Authenticated HTTP host for the Market Terminal analytical engine"
license = "MIT"
repository = "https://github.com/thedjpetersen/market-terminal"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
market-terminal-engine = { path = "../market-terminal-engine" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
