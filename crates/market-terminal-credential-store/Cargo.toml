[package]
name = "market-terminal-credential-store"
version = "0.1.0"
edition = "2021"
description = "Private hashed credential catalog adapter for Market Terminal hosts"
license = "MIT"
repository = "https://github.com/thedjpetersen/market-terminal"

[dependencies]
market-terminal-application = { path = "../market-terminal-application" }
market-terminal-auth = { path = "../market-terminal-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
