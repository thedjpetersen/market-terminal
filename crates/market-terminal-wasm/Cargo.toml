[package]
name = "market-terminal-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser host adapter for Market Terminal application services"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
market-terminal-application = { path = "../market-terminal-application" }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
