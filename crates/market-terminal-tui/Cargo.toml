[package]
name = "market-terminal-tui"
version = "0.1.0"
edition = "2021"
description = "Native terminal host for the Market Terminal analytical engine"
license = "MIT"
repository = "https://github.com/thedjpetersen/market-terminal"

[lib]
name = "market_terminal"
path = "src/lib.rs"

[[bin]]
name = "market-terminal"
path = "src/main.rs"

[dependencies]
market-terminal-engine = { path = "../market-terminal-engine" }
crossterm = "0.29"
csv = "1.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
dom_smoothie = "0.18"
feed-rs = "2.4"
futures-util = "0.3"
html-escape = "0.2"
irc = { version = "1.1", default-features = false, features = ["tls-rust"] }
quick-xml = { version = "0.42", features = ["serialize"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
market-terminal-api = { path = "../market-terminal-api" }
market-terminal-application = { path = "../market-terminal-application" }
