name: Screenshot Gallery
on:
  push:
    paths:
      - .github/workflows/screenshots.yml
      - Cargo.toml
      - crates/market-terminal-engine/**
      - crates/market-terminal-tui/Cargo.toml
      - crates/market-terminal-tui/examples/capture_gallery.rs
      - README.md
      - crates/market-terminal-tui/src/**
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p market-terminal-tui --example capture_gallery -- target/screenshots target/asciinema
      - uses: actions/upload-artifact@v4
        with:
          name: market-terminal-screenshots
          path: target/screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: market-terminal-asciinema
          path: target/asciinema/*.cast
          if-no-files-found: error
